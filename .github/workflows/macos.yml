# macOS 打包（**未签名**）—— 背景与取舍见 docs/release/macos-plan.md
#
# 为什么要有它：开发机是 Windows，编不出 macOS 包；这台 Mac 由 GitHub 免费提供
# （**公开仓库**的标准 runner 免费且不限量；私有仓库才按分钟计费）。
#
# 它只做三件事：把 .app 编出来 → 打成 .dmg → 当产物传上去。
# **不签名、不公证**（用户 2026-10-11：「来路不明无所谓」）：用户第一次打开会被系统拦，
# 要去「系统设置 → 隐私与安全性 → 仍要打开」，那三步写在上面那份计划书第七节。
# 哪天买了开发者账号，要加的也只有「签 .app → 签 .dmg → 公证 → staple」四步。
name: macOS 打包

on:
  workflow_dispatch: # 手动点一下就能跑 —— 第一次就靠它
  push:
    tags: ['v*'] # 打了 v* 的 tag 自动出包
  # 平时 push 不跑：一次 macOS 构建要 5–12 分钟，没必要每次提交都等它

# 同一个 ref 上只留最新一次：上面那个 timeout 是给「卡住」兜底的，
# 而真卡住时最烦的不是它白跑，是它占着队列位、后面那次干等（免费 ≠ 不心疼时间）。
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    # ⚠️ **钉版本，别用 `macos-latest`**：macos-13 已退役、macos-14 公告 2026-11-02 起
    # 不再支持。这一 job 只编译+打包（不受 macos-15 那个「跑集成测试前台化失败后挂住」
    # 的问题影响）；真要跑起来的那个自检在下面 smoke-launch 那个 job 里，
    # 它自己带了短得多的超时 —— 别把两条链揉成一个 job，一条挂住会连累出包。
    runs-on: macos-15
    # 实测 8m55s（2026-10-11，冷缓存）；25 分钟留了约三倍余量。
    # 原来写 40 是没数据时的保守值 —— 真卡住时那 40 分钟就是白占队列。
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # 2026-10-15 从 3.44.2 升到 3.47.7（与 ios.yml、与本机开发同一个版本）。
          # pubspec 的 SDK 约束（^3.12.2）不用动：3.47.7 带的 Dart 3.13.5 满足它。
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: 环境信息（构建失败时第一条要看的东西）
        run: |
          flutter --version
          xcodebuild -version
          sw_vers

      - name: 取依赖
        run: flutter pub get

      - name: 编译（Release）
        run: flutter build macos --release

      - name: 看一眼产物（架构 / 签名 / 版本号）
        # 这一条不只是自检：计划书第十一节把「到底出的是 arm64 还是 universal」
        # 和「Flutter 默认给的是不是本地签名」都列进「没验过」了，这里就是答案。
        run: |
          APP="build/macos/Build/Products/Release/Gracelink.app"
          echo "--- 架构（主二进制）---"
          lipo -archs "$APP/Contents/MacOS/Gracelink"

          # 上面那行只说了宿主可执行文件。**光看它不能说「Intel 也能用」**：
          # 决定一个包能不能在 Intel 上跑的是包内**每一个** Mach-O ——
          # 内嵌的 framework、插件的 .bundle、dylib、helper，任何一个只出 arm64，
          # 整个包就只能在 Apple Silicon 上跑（Intel 机器上双击是「已损坏」那种死法）。
          # 所以这里把每个 Mach-O 都 lipo 一遍，把分布和结论直接打在日志里。
          echo "--- 架构（包内每个 Mach-O）---"
          find "$APP" -type f -print0 | while IFS= read -r -d '' f; do
            case "$(file -b "$f")" in
              *Mach-O*) printf '%s\t%s\n' "$(lipo -archs "$f" 2>/dev/null)" "${f#"$APP"/}" ;;
            esac
          done | sort | tee /tmp/machos.txt

          echo "--- 架构小结 ---"
          total=$(grep -c . /tmp/machos.txt || true)
          both=$(grep -cE 'x86_64.*arm64|arm64.*x86_64' /tmp/machos.txt || true)
          echo "包内 Mach-O 共 $total 个，其中 x86_64+arm64 双架构 $both 个"
          # 「一个都没找到」和「找到了但有单架构」必须分开说：
          # 不分开的话，哪天产物路径变了、这里扫了个空，日志看上去还算出个结论 —— 那比报错更坏。
          if [ "$total" = "0" ]; then
            echo "结论：一个 Mach-O 都没扫到 —— 这段自己坏了（产物路径变了吗？），别当结论用"
          elif [ "$total" = "$both" ]; then
            echo "结论：全部通吃 → 这个包在 Intel 与 Apple Silicon 上都能跑"
          else
            echo "结论：有 Mach-O 只出单架构 → 别对外说「Intel 也能用」（就是上面单架构那几行）"
          fi

          echo "--- 签名 ---"
          codesign -dv --verbose=2 "$APP" 2>&1 | head -20 || true
          echo "--- 版本号 ---"
          echo "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")+$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Contents/Info.plist")"

      # 里面除了 App 本身，还放一个「应用程序」文件夹（英文名就是 Applications）的快捷方式
      # —— 这是 Mac 上装软件的标准形态：打开 dmg，把 Gracelink 拖到这个快捷方式上。
      - name: 打成 dmg（用户打开后拖一下就能装）
        run: |
          VERSION=$(grep -m1 '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          APP="build/macos/Build/Products/Release/Gracelink.app"
          mkdir -p build/dmg
          cp -R "$APP" build/dmg/
          ln -s /Applications build/dmg/Applications
          hdiutil create -volname "Gracelink" -srcfolder build/dmg \
            -ov -format UDZO "Gracelink-$VERSION.dmg"
          ls -lh "Gracelink-$VERSION.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: Gracelink-macos-dmg
          path: Gracelink-*.dmg
          if-no-files-found: error

  # 「编得过」不等于「跑得起来」—— 这一 job 就补中间那一格：
  # 把 App 真的启动起来，看它能不能走到登录页（用例见 integration_test/boot_smoke_test.dart）。
  # 它跟上面那个 job 并行、互不牵连：出包不受自检影响，自检红也不会拖住包。
  smoke-launch:
    runs-on: macos-15
    # 用例自己判 3 分钟死，这里再套一层 12 分钟的壳：
    # 万一是「App 起来了但前台化失败」那种挂住，至少有上限、不白占队列。
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: 取依赖
        run: flutter pub get

      - name: 真启动一次（跑到登录页就算过）
        # tee 是为了留现场：失败时应用自己那串 debugPrint（启动日志、缺失的通道、
        # 沙箱拒绝的那些）全在里面，只靠 CI 的摘要是看不出的。
        # `set -o pipefail`：不加的话 tee 成功就整体算成功，测试红了也当绿的。
        run: |
          set -o pipefail
          flutter test integration_test/boot_smoke_test.dart -d macos 2>&1 | tee smoke-launch.log

      - name: 启动日志（失败时唯一的现场）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-smoke-log
          path: smoke-launch.log
          if-no-files-found: warn
