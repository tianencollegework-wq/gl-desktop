name: just_audio_windows_plus
description: 'Vendored copy of just_audio_windows_plus 0.5.3 with a local teardown patch (see windows/just_audio_windows_plus_plugin.cpp).'
version: 0.5.3
repository: https://github.com/OmarAfifi-CSE/just_audio_windows_plus
issue_tracker: https://github.com/OmarAfifi-CSE/just_audio_windows_plus/issues

topics:
  - audio
  - windows
  - just-audio
  - audio-player
  - media-player

environment:
  sdk: ^3.0.0
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    implements: just_audio
    platforms:
      windows:
        pluginClass: JustAudioWindowsPlusPlugin
